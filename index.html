<!DOCTYPE html>
<html lang="en"> 
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="description" content="Satisfy Your Cravings with a Tap – Order, Eat, Enjoy!" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="keywords" content="Food, Swiggy, Zomato, UberEat, Swadify, Awaze Shaikh, Delicious Food">
        <meta name="author" content="Awaze Shaikh">
        <link rel="stylesheet" href="./index.css" />
        <link
        rel="icon"
        href="./src/utils/Logo.png"
        />
        <title>Swadify | Discover & Savor Delicious Meals</title>
    <script>
      (function() {
        var stored = localStorage.getItem('swadify-theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (stored === 'dark' || (!stored && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    </head>
    <body class="bg-amber-50 dark:bg-gray-950">
        <div id="root"></div>
        <script type="module" src="./src/App.js"></script>
    </body>
</html>
